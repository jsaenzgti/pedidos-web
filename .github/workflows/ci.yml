name: CI

# Corre en cada push a main y en cada pull request.
on:
  push:
    branches: [main]
  pull_request:

# Permisos mínimos: el job solo lee el código.
permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4.2.2

      - name: Instalar .NET SDK
        uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: 10.0.301

      - name: Compilar
        run: dotnet build --nologo --configuration Release

      - name: Probar
        run: dotnet test --nologo --configuration Release --no-build
