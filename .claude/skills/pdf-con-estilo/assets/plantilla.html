<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>{{TITULO}}</title>
<style>
  :root {
    --tinta: #1f2933;
    --suave: #5b6770;
    --acento: #1d4e89;
    --acento-claro: #e8f0f9;
    --linea: #cfd8e3;
    --cebra: #f5f8fc;
  }
  @page { size: A4; margin: 0; }
  * { box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    font-size: 10.5pt; line-height: 1.5; color: var(--tinta);
  }

  /* Portada */
  .portada {
    height: 296mm; padding: 28mm 22mm; page-break-after: always; overflow: hidden;
    background: linear-gradient(180deg, var(--acento) 0, var(--acento) 112mm, #fff 112mm);
  }
  .portada .titulo-bloque { height: 84mm; display: flex; flex-direction: column; justify-content: flex-end; color: #fff; }
  .portada h1 { font-size: 30pt; line-height: 1.15; margin: 0; font-weight: 700; }
  .portada .detalle { margin-top: 34mm; font-size: 11pt; color: var(--tinta); }
  .portada .detalle p { margin: 0 0 3mm; }
  .portada .detalle blockquote { margin: 0 0 6mm; padding: 3mm 4mm; background: var(--acento-claro);
    border-left: 3px solid var(--acento); color: var(--suave); font-size: 9.5pt; }
  .portada .detalle blockquote p { margin: 0; }

  /* Contenido */
  .contenido { padding: 20mm 20mm 22mm; }
  h2 { font-size: 16pt; color: var(--acento); border-bottom: 2px solid var(--acento);
       padding-bottom: 2mm; margin: 9mm 0 4mm; page-break-after: avoid; }
  h3 { font-size: 12.5pt; color: var(--acento); margin: 6mm 0 2mm; page-break-after: avoid; }
  p { margin: 0 0 3mm; }
  ul, ol { margin: 0 0 3mm; padding-left: 6mm; }
  li { margin-bottom: 1.2mm; }
  strong { color: #000; }
  code { font-family: Consolas, "Courier New", monospace; font-size: 9pt;
         background: #eef2f6; padding: 0.3mm 1.2mm; border-radius: 2px; }
  pre { background: #1f2933; color: #f2f5f8; padding: 3mm 4mm; border-radius: 3px;
        font-size: 8.5pt; line-height: 1.4; white-space: pre-wrap; page-break-inside: avoid; }
  pre code { background: none; color: inherit; padding: 0; }
  blockquote { margin: 0 0 4mm; padding: 2.5mm 4mm; background: var(--acento-claro);
               border-left: 3px solid var(--acento); color: var(--suave); }
  blockquote p { margin: 0; }

  /* Tablas */
  table { width: 100%; border-collapse: collapse; margin: 2mm 0 5mm; font-size: 8.8pt; line-height: 1.35; }
  th { background: var(--acento); color: #fff; text-align: left; font-weight: 600;
       padding: 2mm 2.5mm; border: 1px solid var(--acento); }
  td { padding: 1.8mm 2.5mm; border: 1px solid var(--linea); vertical-align: top; overflow-wrap: break-word; }
  tbody tr:nth-child(even) td { background: var(--cebra); }
  tr { page-break-inside: avoid; }
  thead { display: table-header-group; }
</style>
</head>
<body>
  <section class="portada">
    <div class="titulo-bloque"><h1>{{TITULO}}</h1></div>
    <div class="detalle">{{PORTADA}}</div>
  </section>
  <main class="contenido">
{{CONTENIDO}}
  </main>
</body>
</html>
